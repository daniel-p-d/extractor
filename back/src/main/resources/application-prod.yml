spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
  jpa:
    show-sql: false
  mail:
    host: sandbox.smtp.mailtrap.io
    port: 2525
    username: ${MAILTRAP_USER}
    password: ${MAILTRAP_PASS}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

scraper:
  catho:
    delay-ms: 600
  vagascom:
    delay-ms: 2000

scheduler:
  coleta:
    cron: "0 0 6 * * *"
  analise:
    cron: "0 0 7 * * *"

logging:
  level:
    com.daniel_p_d.extractor: INFO
    org.hibernate.SQL: WARN