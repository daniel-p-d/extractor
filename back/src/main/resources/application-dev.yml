spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/vagas_db
    username: vagas_user
    password: vagas_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
  jpa:
    show-sql: true
  mail:
    host: sandbox.smtp.mailtrap.io
    port: 2525
    username: ${MAILTRAP_USER}
    password: ${MAILTRAP_PASS}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    com.daniel_p_d.extractor: DEBUG
    org.hibernate.SQL: DEBUG