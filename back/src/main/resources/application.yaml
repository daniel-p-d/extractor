spring:
  application:
    name: extractor
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

habilidades:
  cache:
    refresh-ms: 3600000  