version: '3.8'

services:
  postgres:
    image: postgres:16.3
    container_name: vagasbd
    environment:
      POSTGRES_USER: vagas_user
      POSTGRES_PASSWORD: vagas_pass
      POSTGRES_DB: vagas_db
    ports:
      - "5432:5432"
    volumes:
      - vagasbd-data:/var/lib/postgresql/data
    networks:
      - vagas-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vagas_user -d vagas_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8.9
    container_name: pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "15432:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - vagas-network
    depends_on:
      - postgres

networks:
  vagas-network:
    driver: bridge

volumes:
  vagasbd-data:
  pgadmin-data:
