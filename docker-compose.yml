services:
  postgres:
    image: postgres:16.3
    container_name: vagas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vagas_db
      POSTGRES_USER: vagas_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vagas_user -d vagas_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: extractor-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/vagas_db
      DATABASE_USERNAME: vagas_user
      DATABASE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAILTRAP_USER: ${MAILTRAP_USER}
      MAILTRAP_PASS: ${MAILTRAP_PASS}
    ports:
      - "8080:8080"

volumes:
  postgres_data: